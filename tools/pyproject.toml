[project]
name = "gen-sandbox-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
   "colorama",
   "rich",
   "pydantic",
   "sexpdata",
   "mistune",
]

[dependency-groups]
dev = [
   "mypy",
   "pytest",
   "pytest-cov",
   "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=shared --cov-report=term-missing --cov-report=html"

[tool.ruff]
target-version = "py312"
line-length = 99
exclude = ["stubs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "stubs"

[[tool.mypy.overrides]]
module = "sexpdata"
ignore_errors = true